project_id = "community-safe"

[auth]
enable_anonymous_sign_ins = true      # abonné sans compte : rien à saisir, aucun e-mail
enable_manual_linking = true            # il peut relier plus tard son compte à Apple ou Google
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "savemycommunity://auth-callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.dispatch-alerts]
# L'autorisation est vérifiée dans la fonction (secret cron ou créateur avec alerte en attente).
verify_jwt = false

# Les deux e-mails de connexion affichent un code à 6 chiffres (pas de lien à cliquer).
[auth.email.template.confirmation]
subject = "SaveMyCommunity — {{ .Token }}"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "SaveMyCommunity — {{ .Token }}"
content_path = "./supabase/templates/otp.html"

[auth.rate_limit]
email_sent = 1000

[functions.billing]
verify_jwt = false          # l'utilisateur est authentifié dans la fonction

[functions.stripe-webhook]
verify_jwt = false          # appelée par Stripe, authentifiée par signature

[functions.delete-account]
verify_jwt = false

[functions.certify]
verify_jwt = false          # l'utilisateur est authentifié dans la fonction

[functions.presence-webhook]
verify_jwt = false          # appelée par le prestataire, authentifiée par signature

[functions.revenuecat-webhook]
verify_jwt = false          # appelée par RevenueCat, authentifiée par secret
