project_id = "community-safe"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "communitysafe://auth-callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.dispatch-alerts]
# L'autorisation est vérifiée dans la fonction (secret cron ou créateur avec alerte en attente).
verify_jwt = false

# Les deux e-mails de connexion affichent un code à 6 chiffres (pas de lien à cliquer).
[auth.email.template.confirmation]
subject = "Community Safe — {{ .Token }}"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Community Safe — {{ .Token }}"
content_path = "./supabase/templates/otp.html"

[auth.rate_limit]
email_sent = 1000
